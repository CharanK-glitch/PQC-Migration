# PostgreSQL Client Authentication Configuration File
# ===================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# VULNERABLE: Local connections using MD5
local   all             all                                     md5

# SAFE: Host connections using SCRAM-SHA-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# VULNERABLE: Using password (plaintext) for some connections
host    all             all             10.0.0.0/24             password

# SAFE: SSL connections with certificate verification
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256

# VULNERABLE: Using ident authentication
host    all             all             192.168.1.0/24          ident

# VULNERABLE: Using MD5 for replication
host    replication     replicator      10.0.0.0/24             md5

# SAFE: Using cert authentication for admin
hostssl admin           admin           10.0.0.0/24             cert
