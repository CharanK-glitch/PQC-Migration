# PostgreSQL 16 Configuration - Mixed PQC Readiness
# This config has both vulnerable and safe settings for testing

# ============================================
# CONNECTION SETTINGS
# ============================================
listen_addresses = '*'
port = 5432
max_connections = 100

# ============================================
# SSL/TLS SETTINGS
# ============================================

# SSL is enabled (good)
ssl = on

# Certificate files
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ca_file = '/etc/ssl/certs/ca.crt'

# VULNERABLE: TLS 1.2 minimum (should be 1.3)
ssl_min_protocol_version = 'TLSv1.2'

# SAFE: Good cipher configuration
ssl_ciphers = 'HIGH:!aNULL:!eNULL:!MD5:!RC4:!3DES:!DES'

# VULNERABLE: Using P-256 curve (quantum-vulnerable)
ssl_ecdh_curve = 'P-256'

# SAFE: Server cipher preference
ssl_prefer_server_ciphers = on

# ============================================
# AUTHENTICATION SETTINGS
# ============================================

# SAFE: SCRAM-SHA-256 authentication
password_encryption = scram-sha-256

# ============================================
# WAL SETTINGS
# ============================================
wal_level = replica
max_wal_senders = 10

# ============================================
# LOGGING
# ============================================
log_connections = on
log_disconnections = on
log_statement = 'ddl'
